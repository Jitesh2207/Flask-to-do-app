<!doctype html>
<html>
  <head>
    <title>Flask To-Do App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 40px;
      }
      input {
        padding: 10px;
        width: 250px;
      }
      button {
        padding: 10px;
        margin-left: 10px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        margin: 8px 0;
      }
      a {
        color: blue;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>📝 My To-Do List</h1>

    <form action="/add" method="POST">
      <input type="text" name="task" placeholder="Enter a task..." required />
      <button type="submit">Add Task</button>
    </form>

    <ul>
      {% for task in tasks %}
      <li>{{ task }} <a href="/delete/{{ loop.index0 }}">❌</a></li>
      {% endfor %}
    </ul>
  </body>
</html>
